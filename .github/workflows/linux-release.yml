name: Linux Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libncursesw5-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Clean stale CMake build directory
        run: rm -rf build 
        
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release


      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify binary
        run: |
          test -x build/univecho
          if ldd build/univecho | grep -q "not found"; then
            ldd build/univecho
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p package
          install -Dm755 build/univecho package/univecho

          cat > package/README.txt <<'EOF'
          UNIV-ECHO - Linux x86_64

          Run:
            ./univecho

          Manual install:
            install -Dm755 univecho "$HOME/.local/bin/univecho"

          The application requires ncursesw, SQLite 3, libcurl,
          OpenSSL and their runtime dependencies.

          EOF

          tar -C package -czf univecho-linux-x86_64.tar.gz .
          sha256sum univecho-linux-x86_64.tar.gz \
            > univecho-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            univecho-linux-x86_64.tar.gz
            univecho-linux-x86_64.tar.gz.sha256
