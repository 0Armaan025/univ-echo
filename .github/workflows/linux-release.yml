name: UNIV-ECHO Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsqlite3-dev libcurl4-openssl-dev \
            nlohmann-json3-dev libncursesw5-dev \
            rpm wget file

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2

      - name: Build DEB and RPM
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cpack --config build/CPackConfig.cmake -G RPM -B dist

      - name: Build generic Linux archive
        run: |
          mkdir -p package
          install -Dm755 build/univecho package/univecho
          tar -C package -czf dist/univecho-linux-x86_64.tar.gz .
          sha256sum dist/univecho-linux-x86_64.tar.gz \
            > dist/univecho-linux-x86_64.tar.gz.sha256

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          install -Dm755 build/univecho AppDir/usr/bin/univecho
          install -Dm644 packaging/appimage/univecho.desktop \
            AppDir/univecho.desktop
          install -Dm644 packaging/appimage/univecho.svg \
            AppDir/univecho.svg

      - name: Bundle AppImage dependencies
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy
          chmod +x linuxdeploy

          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/univecho \
            --desktop-file AppDir/univecho.desktop \
            --icon-file AppDir/univecho.svg

      - name: Generate AppImage
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool
          chmod +x appimagetool

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool AppDir \
            dist/univecho-x86_64.AppImage

          chmod +x dist/univecho-x86_64.AppImage
          sha256sum dist/univecho-x86_64.AppImage \
            > dist/univecho-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  windows:
    name: Windows x86_64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-pdcurses

      - name: Diagnose PDCurses
        run: |
          echo "=== PDCurses library symbols ==="
          nm -g "$MINGW_PREFIX/lib/libpdcurses.a" | grep -i endwin || true

          echo "=== PDCurses header ==="
          grep -n "endwin" "$MINGW_PREFIX/include/pdcurses/curses.h" || true

          echo "=== PDCurses files ==="
          ls -lh "$MINGW_PREFIX/lib/"*pdcurses*

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" \
            -DPDCURSES_INCLUDE_DIR="$MINGW_PREFIX/include/pdcurses" \
            -DPDCURSES_LIBRARY="$MINGW_PREFIX/lib/libpdcurses.a"

      - name: Build
        run: cmake --build build --parallel

      - name: Package executable
        run: |
          mkdir -p dist
          cp build/univecho.exe dist/
          cp "$MINGW_PREFIX"/bin/*.dll dist/ || true
          cd dist
          7z a ../univecho-windows-x86_64.zip *
          cd ..
          sha256sum univecho-windows-x86_64.zip \
            > univecho-windows-x86_64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            univecho-windows-x86_64.zip
            univecho-windows-x86_64.zip.sha256

  arch:
    name: Arch Linux package
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build package inside Arch Linux
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:base-devel \
            bash -lc '
              pacman -Syu --noconfirm --needed \
                cmake pkgconf sqlite curl ncurses nlohmann-json

              useradd -m builder
              chown -R builder:builder /src

              su builder -c "cd /src && makepkg --syncdeps --noconfirm --cleanbuild"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [linux, windows, arch]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \
            ! -name '*.sha256' -print0 |
            xargs -0 sha256sum > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
